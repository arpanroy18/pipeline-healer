name: Watchdog Auto-Healer

on:
  workflow_run:
    workflows: ["Test Pipeline"]
    types:
      - completed

permissions:
  actions: write
  contents: write

jobs:
  heal:
    name: Watchdog Auto-Healer
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install httpx

      - name: Run Watchdog Handler
        env:
          GH_TOKEN: ${{ secrets.WATCHDOG_TOKEN || secrets.GITHUB_TOKEN }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          python scripts/watchdog_handler.py
